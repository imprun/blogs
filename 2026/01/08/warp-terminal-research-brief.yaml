research_brief:
  topic: "Warp 터미널의 무료 기능 - 터미널 대체제로서의 가치"
  date: "2026-01-08"
  researcher: "astory-researcher"

  collected:
    web_sources: 18
    images: 0
    videos: 0

  executive_summary: |
    Warp는 Rust로 작성되고 GPU 가속 렌더링을 사용하는 현대적인 터미널 에뮬레이터다.
    모든 터미널 기능은 완전 무료이며, 유료 플랜은 AI 기능에만 적용된다.
    2025년 2월 Windows 지원, 6월 Warp 2.0 출시로 주요 플랫폼을 모두 지원한다.

    주의: Claude Code 사용 시 Warp에서 스크롤 버그가 발생한다.
    이는 Warp 특유의 블록 기반 렌더링과 Claude Code의 전체 터미널 재그리기 방식 충돌로 인한 것이다.
    iTerm2나 macOS 기본 터미널에서는 발생하지 않으므로, Claude Code 사용 시에는 Warp 대신 다른 터미널 권장.

