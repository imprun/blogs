  claude_code_compatibility:
    status: "NOT_RECOMMENDED"
    issue_summary: |
      Warp에서 Claude Code 사용 시 심각한 스크롤 버그 발생.
      대화 기록이 5-6 페이지 이상 누적되면 키 입력마다 상단으로 스크롤 후 복귀.
      이는 Warp의 블록 기반 렌더링과 Claude Code의 전체 터미널 재그리기 방식 충돌로 인함.

    affected_environments:
      - "Warp 터미널 (독립 실행)"
      - "VSCode/Cursor 내장 터미널"
      - "IntelliJ IDEA 터미널"

    unaffected_environments:
      - "iTerm2"
      - "macOS 기본 Terminal.app"
      - "Alacritty"

    workarounds:
      - method: "tmux 사용"
        description: "tmux 내에서 Claude Code 실행 시 증상 완화"
        effectiveness: "부분적"

      - method: "/compact 명령"
        description: "대화 기록 압축으로 스크롤백 감소"
        effectiveness: "일시적"

      - method: "터미널 변경"
        description: "iTerm2 또는 기본 터미널 사용"
        effectiveness: "완전"

    github_issues:
      - "warpdotdev/Warp#8089"
      - "anthropics/claude-code#3648"
      - "anthropics/claude-code#826"
      - "anthropics/claude-code#9935"

    root_cause: |
      Claude Code가 스트리밍 출력의 각 청크마다 전체 터미널을 재그리기함.
      초당 4,000-6,700 스크롤 이벤트 발생.
      증분 업데이트 대신 전체 재그리기 방식 사용.

